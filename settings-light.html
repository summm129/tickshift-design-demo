<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F4F3F1">
<meta name="robots" content="noindex">
<title>TickShift デザイン 設定</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+JP:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;background:#F4F3F1}
a{color:#4A4844}a:hover{color:#1C1C1A}
input{font:inherit;color:inherit}
button{font:inherit;cursor:pointer}
</style>
</head>
<body>
<div style="width: 100%; max-width: 520px; margin: 0 auto; min-height: 100vh; box-sizing: border-box; background: #F4F3F1; color: #1C1C1A; font-family: 'Inter', 'Noto Sans JP', sans-serif; padding: 0 16px 32px; display: flex; flex-direction: column; gap: 12px; font-variant-numeric: tabular-nums">

<header style="display: flex; align-items: center; gap: 8px; padding: 16px 0 8px">
<a href="./" data-back aria-label="戻る" style="width: 44px; height: 44px; border: 0; border-radius: 999px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; color: #1C1C1A; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
<h1 style="margin: 0; font-size: 18px; font-weight: 700">設定</h1>
</header>

<section style="background: #FFFFFF; border-radius: 24px; padding: 18px">
<h2 style="margin: 0 0 4px; font-size: 15px; font-weight: 700">テーマ</h2>
<p style="margin: 0 0 14px; font-size: 12px; color: #6B6964">画面の色を選びます。</p>
<div role="radiogroup" aria-label="テーマ" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button type="button" role="radio" aria-checked="false" data-opt="theme:light" style="display: block; width: 100%; padding: 8px 8px 12px; border-radius: 18px; background: #FFFFFF; text-align: left; color: inherit; border: 2px solid #ECEAE6">
<div aria-hidden="true" style="height: 84px; border-radius: 12px; background: #F4F3F2; padding: 8px; box-sizing: border-box; display: flex; flex-direction: column; gap: 5px">
<div style="height: 18px; border-radius: 6px; background: #FFFFFE"></div>
<div style="height: 30px; border-radius: 6px; background: #FFFFFE"></div>
<div style="width: 50%; height: 10px; border-radius: 4px; background: #3A3835"></div>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; margin-top: 10px; padding: 0 2px">
<span style="font-size: 13px; font-weight: 600">ライト</span>
<span data-check="theme:light" hidden><span style="width: 20px; height: 20px; border-radius: 999px; background: #3A3834; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span></span>
</div>
</button>
<button type="button" role="radio" aria-checked="false" data-opt="theme:dark" style="display: block; width: 100%; padding: 8px 8px 12px; border-radius: 18px; background: #FFFFFF; text-align: left; color: inherit; border: 2px solid #ECEAE6">
<div aria-hidden="true" style="height: 84px; border-radius: 12px; background: #141414; padding: 8px; box-sizing: border-box; display: flex; flex-direction: column; gap: 5px">
<div style="height: 18px; border-radius: 6px; background: #262626"></div>
<div style="height: 30px; border-radius: 6px; background: #262626"></div>
<div style="width: 50%; height: 10px; border-radius: 4px; background: #E8E2D5"></div>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; margin-top: 10px; padding: 0 2px">
<span style="font-size: 13px; font-weight: 600">ダーク</span>
<span data-check="theme:dark" hidden><span style="width: 20px; height: 20px; border-radius: 999px; background: #3A3834; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span></span>
</div>
</button>
</div>
</section>

<section style="background: #FFFFFF; border-radius: 24px; padding: 18px">
<h2 style="margin: 0 0 4px; font-size: 15px; font-weight: 700">画面の作り</h2>
<p style="margin: 0 0 14px; font-size: 12px; color: #6B6964">計算カードの並べ方を選びます。</p>
<div role="radiogroup" aria-label="画面の作り" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button type="button" role="radio" aria-checked="false" data-opt="layout:scroll" style="display: block; width: 100%; padding: 8px 8px 12px; border-radius: 18px; background: #FFFFFF; text-align: left; color: inherit; border: 2px solid #ECEAE6">
<div aria-hidden="true" style="height: 84px; border-radius: 12px; background: #F4F3F1; padding: 8px; box-sizing: border-box; display: flex; flex-direction: column; gap: 4px">
<div style="height: 14px; border-radius: 5px; background: #E6E4E0"></div>
<div style="height: 14px; border-radius: 5px; background: #E6E4E0"></div>
<div style="height: 14px; border-radius: 5px; background: #E6E4E0"></div>
<div style="height: 14px; border-radius: 5px; background: #E6E4E0"></div>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; margin-top: 10px; padding: 0 2px">
<span style="text-align: left"><span style="display: block; font-size: 13px; font-weight: 600">スクロール</span><span style="display: block; font-size: 11px; color: #6B6964; margin-top: 2px">全部を縦に並べる</span></span>
<span data-check="layout:scroll" hidden><span style="flex-shrink: 0; width: 20px; height: 20px; border-radius: 999px; background: #3A3834; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span></span>
</div>
</button>
<button type="button" role="radio" aria-checked="false" data-opt="layout:tabs" style="display: block; width: 100%; padding: 8px 8px 12px; border-radius: 18px; background: #FFFFFF; text-align: left; color: inherit; border: 2px solid #ECEAE6">
<div aria-hidden="true" style="height: 84px; border-radius: 12px; background: #F4F3F1; padding: 8px; box-sizing: border-box; display: flex; flex-direction: column; gap: 5px">
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3px; padding: 2px; border-radius: 999px; background: #E6E4E0">
<div style="height: 8px; border-radius: 999px; background: #FFFFFF"></div>
<div style="height: 8px"></div>
<div style="height: 8px"></div>
</div>
<div style="flex: 1; border-radius: 6px; background: #E6E4E0"></div>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; margin-top: 10px; padding: 0 2px">
<span style="text-align: left"><span style="display: block; font-size: 13px; font-weight: 600">タブ</span><span style="display: block; font-size: 11px; color: #6B6964; margin-top: 2px">1つずつ切り替える</span></span>
<span data-check="layout:tabs" hidden><span style="flex-shrink: 0; width: 20px; height: 20px; border-radius: 999px; background: #3A3834; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span></span>
</div>
</button>
</div>
</section>

<section style="background: #FFFFFF; border-radius: 24px; padding: 18px">
<h2 style="margin: 0 0 14px; font-size: 15px; font-weight: 700">損益分岐点</h2>
<div style="display: flex; align-items: center; gap: 12px">
<div style="flex: 1; min-width: 0">
<div style="font-size: 13px; font-weight: 500">最初に表示する口座</div>
<div style="font-size: 11px; color: #6B6964; margin-top: 2px">画面を開いたときの選択</div>
</div>
<div role="group" aria-label="最初に表示する口座" style="display: flex; padding: 3px; border-radius: 999px; background: #F4F3F1; gap: 2px">
<button type="button" aria-pressed="true" data-acct-btn="t" style="height: 36px; padding: 0 14px; border: 0; border-radius: 999px; font-size: 12px; font-weight: 600; background: #FFFFFF; color: #1C1C1A; box-shadow: 0 1px 3px rgba(28,28,26,0.12)">特定</button>
<button type="button" aria-pressed="false" data-acct-btn="n" style="height: 36px; padding: 0 14px; border: 0; border-radius: 999px; font-size: 12px; font-weight: 600; background: transparent; color: #6B6964; box-shadow: none">NISA</button>
</div>
</div>
</section>

<section style="background: #FFFFFF; border-radius: 24px; padding: 6px 18px">
<button type="button" style="display: flex; align-items: center; justify-content: space-between; width: 100%; min-height: 52px; border: 0; background: transparent; padding: 0; color: #B4382E; font-size: 13px; font-weight: 600">
<span>入力をすべてクリア</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
</button>
<div style="border-top: 1px solid #ECEAE6; display: flex; align-items: center; justify-content: space-between; min-height: 52px; font-size: 13px">
<span style="color: #4A4844">バージョン</span>
<span style="color: #6B6964">1.1.0</span>
</div>
</section>

<p style="margin: 4px 4px 0; font-size: 11px; line-height: 1.7; color: #6B6964">設定はこのブラウザに保存されます。</p>
</div>
<script>
(() => {
  const THEME = "light", TILE_ON = "display: block; width: 100%; padding: 8px 8px 12px; border-radius: 18px; background: #FFFFFF; text-align: left; color: inherit; border: 2px solid #3A3834", TILE_OFF = "display: block; width: 100%; padding: 8px 8px 12px; border-radius: 18px; background: #FFFFFF; text-align: left; color: inherit; border: 2px solid #ECEAE6", PILL_ON = "height: 36px; padding: 0 14px; border: 0; border-radius: 999px; font-size: 12px; font-weight: 600; background: #FFFFFF; color: #1C1C1A; box-shadow: 0 1px 3px rgba(28,28,26,0.12)", PILL_OFF = "height: 36px; padding: 0 14px; border: 0; border-radius: 999px; font-size: 12px; font-weight: 600; background: transparent; color: #6B6964; box-shadow: none";
  const params = new URLSearchParams(location.search);
  const state = { theme: THEME, layout: params.get("layout") === "tabs" ? "tabs" : "scroll" };
  const render = () => {
    for (const el of document.querySelectorAll("[data-opt]")) {
      const [key, val] = el.dataset.opt.split(":");
      const on = state[key] === val;
      el.setAttribute("aria-checked", String(on));
      el.setAttribute("style", on ? TILE_ON : TILE_OFF);
    }
    for (const el of document.querySelectorAll("[data-check]")) {
      const [key, val] = el.dataset.check.split(":");
      el.hidden = state[key] !== val;
    }
  };
  for (const el of document.querySelectorAll("[data-opt]")) el.addEventListener("click", () => {
    const [key, val] = el.dataset.opt.split(":");
    if (key === "theme" && val !== THEME) {
      // テーマを変えたら、その色の設定画面へ切り替えて見た目を確かめられるようにする
      location.href = `settings-${val}.html?layout=${state.layout}`;
      return;
    }
    state[key] = val;
    render();
  });
  for (const btn of document.querySelectorAll("[data-acct-btn]")) btn.addEventListener("click", () => {
    for (const b of document.querySelectorAll("[data-acct-btn]")) {
      const active = b === btn;
      b.setAttribute("aria-pressed", String(active));
      b.setAttribute("style", active ? PILL_ON : PILL_OFF);
    }
  });
  document.querySelector("[data-back]").addEventListener("click", (event) => {
    event.preventDefault();
    location.href = `design-${state.layout === "scroll" ? "a" : "c"}-${state.theme}.html`;
  });
  render();
})();
</script>
</body>
</html>
